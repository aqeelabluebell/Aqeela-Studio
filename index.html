<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Basnet Font Demo</title>
  <style>
    @font-face {
      font-family: 'Basnet Demo';
      src: url('BasnetDemo.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
    }
    h1 {
      font-size: 40px;
      margin-bottom: 10px;
      font-family: 'Basnet Demo', sans-serif;
    }
    p {
      font-size: 18px;
      margin-bottom: 30px;
    }
    textarea {
      font-family: 'Basnet Demo', sans-serif;
      font-size: 32px;
      padding: 15px;
      width: 90%;
      max-width: 700px;
      min-height: 100px;
      resize: vertical;
      border: 2px solid #ccc;
      border-radius: 10px;
      background-color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .button {
      display: inline-block;
      margin-top: 30px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      background-color: #222;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      transition: background-color 0.3s;
    }
    .button:hover {
      background-color: #444;
    }
    footer {
      margin-top: 60px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>Basnet Font Demo</h1>
  <p>Preview and test the <strong>Basnet</strong> demo font below:</p>

  <textarea placeholder="Type your text here...">Typography is power.</textarea>

  <br />
  <a class="button" href="Basnet_Demo_WOFF2.zip" download>⬇ Download Demo Font</a>

  <footer>
    <p>Font by Aqeela Studio &middot; For demo use only</p>
  </footer>
</body>
</html>
